<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>업무 보드</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff'/%3E%3Crect x='17' y='8' width='8' height='6' rx='3' fill='%23fff' fill-opacity='.7'/%3E%3Crect x='7' y='18' width='18' height='6' rx='3' fill='%23fff' fill-opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/board.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="app-name"><span class="app-mark" aria-hidden="true"></span><span class="app-title">업무 보드</span></p>
      <div class="head-tools">
        <p class="sync" id="sync" role="status" data-tone="wait">연결 중…</p>
        <p class="sr" id="tally" aria-live="polite"></p>
        <div class="segmented" id="seg" data-sel="board" role="group" aria-label="보기">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" id="segBoard" aria-pressed="true">진행 중<span class="n" id="nActive"></span></button>
          <button type="button" id="segDone" aria-pressed="false">완료<span class="n" id="nDone"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <button class="date-btn" id="stamp" type="button" aria-haspopup="dialog" aria-label="오늘 날짜, 근무 달력 열기">
        <span id="stampText"></span>
        <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5L12 15l5.5-5.5"/></svg>
      </button>
      <button class="icon-btn album-btn" id="albumBtn" type="button" aria-haspopup="dialog" aria-label="사진첩 열기"><span>사진첩</span></button>
    </section>

    <div class="board" id="board" aria-label="업무 보드">
      <div class="lanes" id="lanes"></div>
      <div class="shared" id="shared">
        <section class="common" id="common" aria-labelledby="common-title">
          <div id="common-head"></div>
          <div id="common-drop"></div>
        </section>
        <section class="common regular" id="regular" aria-labelledby="regular-title">
          <div id="regular-head"></div>
          <div id="regular-drop"></div>
        </section>
      </div>
    </div>

    <section class="done-view" id="done" aria-labelledby="done-title" hidden></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
