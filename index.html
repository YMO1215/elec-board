<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>업무 보드</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff'/%3E%3Crect x='17' y='8' width='8' height='6' rx='3' fill='%23fff' fill-opacity='.7'/%3E%3Crect x='7' y='18' width='18' height='6' rx='3' fill='%23fff' fill-opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/board.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="app-name"><span class="app-mark" aria-hidden="true"></span>업무 보드</p>
      <div class="head-tools">
        <p class="sync" id="sync" role="status" data-tone="wait">연결 중…</p>
        <p class="tally" id="tally" aria-live="polite"></p>
        <button class="pill" id="doneBtn" type="button" aria-pressed="false">완료 보기</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <button class="date-btn" id="stamp" type="button" aria-haspopup="dialog" aria-label="오늘 날짜, 근무 달력 열기"></button>
    </section>

    <div class="board" id="board" aria-label="업무 보드">
      <div class="lanes" id="lanes"></div>
      <section class="common" id="common" aria-labelledby="common-title">
        <div id="common-head"></div>
        <!-- built once and never re-rendered, so typing survives live updates -->
        <div class="quick" id="quick" hidden>
          <input class="quick-input" id="quickInput" type="text" maxlength="200" autocomplete="off" enterkeyhint="send"
                 placeholder="업무 입력 · Enter = 공통" aria-label="빠른 업무 입력">
          <div class="quick-people" id="quickPeople" role="group" aria-label="담당자에게 바로 붙이기"></div>
        </div>
        <div id="common-drop"></div>
      </section>
    </div>

    <section class="done-view" id="done" aria-labelledby="done-title" hidden></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
